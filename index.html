<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MultiGame Hub</title>
<style>
:root {
  --bg: #07070c; --panel: #12121a; --card: rgba(255,255,255,.04);
  --border: rgba(255,255,255,.08); --cyan: #22d3ee; --pink: #f472b6;
  --purple: #a78bfa; --green: #4ade80; --text: #f1f5f9; --muted: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; touch-action: manipulation; }
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse at 20% 15%, rgba(34,211,238,.08), transparent 50%),
              radial-gradient(ellipse at 80% 85%, rgba(244,114,182,.08), transparent 50%);
}
#hub { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 20px 14px 80px; }
.header { text-align: center; margin-bottom: 24px; }
.header h1 {
  font-size: clamp(1.8rem, 6vw, 2.8rem); font-weight: 900; letter-spacing: -1px;
  background: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.header p { color: var(--muted); margin-top: 6px; font-size: .9rem; }
.badges { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
.badge { padding: 3px 10px; border-radius: 999px; font-size: .7rem; font-weight: 600; border: 1px solid var(--border); background: var(--card); }
.badge.cyan { color: var(--cyan); } .badge.pink { color: var(--pink); } .badge.green { color: var(--green); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
@media (min-width: 500px) { .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; } }

.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
  overflow: hidden; cursor: pointer; transition: transform .15s, border-color .15s;
  text-decoration: none; color: inherit; display: block; -webkit-user-select: none; user-select: none;
}
.card:active { transform: scale(.97); }
.card:hover { border-color: rgba(34,211,238,.35); transform: translateY(-3px); }
.card .prev {
  height: 90px; display: flex; align-items: center; justify-content: center;
  font-size: 2.6rem; background: linear-gradient(145deg, #0f0f18, #1a1a28); position: relative;
}
@media (min-width: 500px) { .card .prev { height: 110px; font-size: 3rem; } }
.card .prev::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, var(--panel), transparent 45%); }
.card .body { padding: 10px 12px 14px; }
.card h3 { font-size: .95rem; font-weight: 700; margin-bottom: 4px; }
.card .meta { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { padding: 2px 7px; border-radius: 5px; background: rgba(255,255,255,.06); font-size: .65rem; }
.tag.p2 { color: var(--pink); } .tag.d3 { color: var(--cyan); }

.foot { text-align: center; margin-top: 28px; color: var(--muted); font-size: .75rem; line-height: 1.5; }

/* Game screen */
#gameScreen {
  display: none; position: fixed; inset: 0; background: #000; z-index: 100;
  flex-direction: column; touch-action: none;
}
#gameScreen.on { display: flex; }
.topbar {
  height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 10px; background: rgba(10,10,16,.95); border-bottom: 1px solid var(--border); z-index: 10;
}
.topbar .t { font-weight: 700; font-size: .85rem; }
.topbar .s { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--cyan); font-size: .85rem; }
.btn {
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: .8rem; font-weight: 600;
}
.btn:active { border-color: var(--cyan); color: var(--cyan); }
#canvasWrap { flex: 1; position: relative; overflow: hidden; min-height: 0; }
#canvasWrap canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; background: rgba(0,0,0,.75); z-index: 5; text-align: center; padding: 20px;
}
.overlay.hide { display: none; }
.overlay h2 {
  font-size: 1.6rem; margin-bottom: 8px;
  background: linear-gradient(135deg, var(--cyan), var(--pink));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.overlay p { color: var(--muted); margin-bottom: 14px; max-width: 320px; font-size: .9rem; line-height: 1.4; }
.btn-play {
  background: linear-gradient(135deg, var(--cyan), var(--purple)); color: #000;
  border: none; padding: 12px 28px; border-radius: 999px; font-weight: 800; font-size: 1rem;
  cursor: pointer; box-shadow: 0 0 20px rgba(34,211,238,.35); min-width: 140px;
}
.btn-play:active { transform: scale(.97); }

.hint {
  position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.65); padding: 6px 12px; border-radius: 8px;
  font-size: .7rem; color: var(--muted); z-index: 4; pointer-events: none;
  max-width: 95%; text-align: center;
}

/* Mobile touch pads */
.pads {
  display: none; position: absolute; bottom: 0; left: 0; right: 0; height: 130px;
  z-index: 6; pointer-events: none; padding: 8px;
}
.pads.show { display: flex; justify-content: space-between; align-items: flex-end; }
.pad-group { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
.pad-row { display: flex; gap: 6px; justify-content: center; }
.pad {
  width: 52px; height: 52px; border-radius: 12px;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; color: #fff; user-select: none;
  touch-action: none;
}
.pad:active, .pad.on { background: rgba(34,211,238,.35); border-color: var(--cyan); }
.pad.pink:active, .pad.pink.on { background: rgba(244,114,182,.35); border-color: var(--pink); }
.pad.wide { width: 110px; }
@media (min-width: 900px) { .pads { display: none !important; } }
</style>
</head>
<body>

<div id="hub">
  <header class="header">
    <h1>MULTIGAME HUB</h1>
    <p>One hub · Many games · Any device</p>
    <div class="badges">
      <span class="badge cyan">3D + Neon</span>
      <span class="badge pink">2 Player</span>
      <span class="badge green">Touch Ready</span>
    </div>
  </header>
  <div class="grid" id="gameGrid"></div>
  <p class="foot">
    Phone: on-screen buttons · PC: keyboard<br>
    Add new games by registering in the script
  </p>
</div>

<div id="gameScreen">
  <div class="topbar">
    <button class="btn" id="btnBack">← Hub</button>
    <span class="t" id="gTitle">Game</span>
    <span class="s" id="gScore">—</span>
  </div>
  <div id="canvasWrap"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   MULTIGAME HUB — Modular single-file engine
   To ADD A NEW GAME:
     1. Games.register({ id, name, icon, tags, start, stop })
     2. In start(wrap): create canvas/Three scene, use Input API
     3. Call Hub.setScore / Hub.showOverlay when needed
   ============================================================ */

const Input = {
  keys: {},
  touches: {}, // virtual button ids
  on(code) { return !!this.keys[code] || !!this.touches[code]; },
  clear() { this.keys = {}; this.touches = {}; }
};

window.addEventListener('keydown', e => { Input.keys[e.code] = true; if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
window.addEventListener('keyup', e => { Input.keys[e.code] = false; });

const Hub = {
  current: null,
  _overlay: null,
  _pads: null,

  init() {
    const grid = document.getElementById('gameGrid');
    Object.values(Games.list).forEach(g => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = '#';
      a.innerHTML = `
        <div class="prev">${g.icon}</div>
        <div class="body">
          <h3>${g.name}</h3>
          <div class="meta">${(g.tags || []).map(t =>
            `<span class="tag ${t === '2P' ? 'p2' : t === '3D' ? 'd3' : ''}">${t}</span>`
          ).join('')}</div>
        </div>`;
      a.onclick = e => { e.preventDefault(); this.open(g.id); };
      grid.appendChild(a);
    });
    document.getElementById('btnBack').onclick = () => this.close();
  },

  open(id) {
    if (this.current && Games.list[this.current]?.stop) Games.list[this.current].stop();
    Input.clear();
    document.getElementById('hub').style.display = 'none';
    document.getElementById('gameScreen').classList.add('on');
    const wrap = document.getElementById('canvasWrap');
    wrap.innerHTML = '';
    this.current = id;
    const g = Games.list[id];
    document.getElementById('gTitle').textContent = g ? g.name : id;
    document.getElementById('gScore').textContent = '—';
    if (g && g.start) g.start(wrap);
  },

  close() {
    if (this.current && Games.list[this.current]?.stop) Games.list[this.current].stop();
    this.current = null;
    Input.clear();
    document.getElementById('canvasWrap').innerHTML = '';
    document.getElementById('gameScreen').classList.remove('on');
    document.getElementById('hub').style.display = 'block';
  },

  setScore(s) { document.getElementById('gScore').textContent = s; },

  showOverlay(html) {
    let o = document.querySelector('#canvasWrap .overlay');
    if (!o) {
      o = document.createElement('div');
      o.className = 'overlay';
      document.getElementById('canvasWrap').appendChild(o);
    }
    o.classList.remove('hide');
    o.innerHTML = html;
    return o;
  },
  hideOverlay() {
    const o = document.querySelector('#canvasWrap .overlay');
    if (o) o.classList.add('hide');
  },

  /* Mobile virtual pads
     layout: { left: [[btn,btn],[btn]], right: [[btn]] }
     btn = { id: 'KeyW', label: '▲', cls: '' }
  */
  showPads(layout) {
    this.hidePads();
    const pads = document.createElement('div');
    pads.className = 'pads show';
    pads.id = 'touchPads';
    const makeGroup = (side, rows) => {
      const g = document.createElement('div');
      g.className = 'pad-group';
      (rows || []).forEach(row => {
        const r = document.createElement('div');
        r.className = 'pad-row';
        row.forEach(b => {
          const el = document.createElement('div');
          el.className = 'pad ' + (b.cls || '') + (b.wide ? ' wide' : '');
          el.textContent = b.label;
          const set = on => {
            Input.touches[b.id] = on;
            el.classList.toggle('on', on);
          };
          el.addEventListener('touchstart', e => { e.preventDefault(); set(true); }, { passive: false });
          el.addEventListener('touchend', e => { e.preventDefault(); set(false); }, { passive: false });
          el.addEventListener('touchcancel', () => set(false));
          el.addEventListener('mousedown', e => { e.preventDefault(); set(true); });
          el.addEventListener('mouseup', () => set(false));
          el.addEventListener('mouseleave', () => set(false));
          r.appendChild(el);
        });
        g.appendChild(r);
      });
      return g;
    };
    pads.appendChild(makeGroup('L', layout.left));
    pads.appendChild(makeGroup('R', layout.right));
    document.getElementById('canvasWrap').appendChild(pads);
    this._pads = pads;
  },
  hidePads() {
    if (this._pads) { this._pads.remove(); this._pads = null; }
  }
};

/* Game registry — ADD NEW GAMES HERE */
const Games = {
  list: {},
  register(def) { this.list[def.id] = def; }
};

/* ========== GAME 1: Neon Pong 3D ========== */
Games.register({
  id: 'pong3d', name: 'Neon Pong 3D', icon: '🏓', tags: ['3D', '2P'],
  start(wrap) {
    let scene, camera, renderer, animId, running = false;
    let paddle1, paddle2, ball, score1 = 0, score2 = 0;
    let ballVel = { x: 0.12, z: 0.08 };
    const W = 12, D = 8;
    const self = this;

    const width = wrap.clientWidth, height = wrap.clientHeight;
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);
    scene.fog = new THREE.Fog(0x050510, 12, 28);
    camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 100);
    camera.position.set(0, 10, 11);
    camera.lookAt(0, 0, 0);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    wrap.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x334466, 0.6));
    const l1 = new THREE.PointLight(0x22d3ee, 1.2, 30); l1.position.set(-5, 6, 0); scene.add(l1);
    const l2 = new THREE.PointLight(0xf472b6, 1.2, 30); l2.position.set(5, 6, 0); scene.add(l2);

    const table = new THREE.Mesh(
      new THREE.BoxGeometry(W, 0.15, D),
      new THREE.MeshStandardMaterial({ color: 0x0a0a18, metalness: 0.3, roughness: 0.7, emissive: 0x112233, emissiveIntensity: 0.15 })
    );
    table.position.y = -0.2; scene.add(table);

    const edgeMat = new THREE.LineBasicMaterial({ color: 0x22d3ee });
    const edgePts = [[-W/2,0.05,-D/2],[W/2,0.05,-D/2],[W/2,0.05,-D/2],[W/2,0.05,D/2],[W/2,0.05,D/2],[-W/2,0.05,D/2],[-W/2,0.05,D/2],[-W/2,0.05,-D/2]]
      .map(p => new THREE.Vector3(...p));
    scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(edgePts), edgeMat));

    const pGeo = new THREE.BoxGeometry(0.35, 0.5, 1.6);
    paddle1 = new THREE.Mesh(pGeo, new THREE.MeshStandardMaterial({ color: 0x22d3ee, emissive: 0x22d3ee, emissiveIntensity: 0.4, metalness: 0.6, roughness: 0.3 }));
    paddle1.position.set(-W/2 + 0.5, 0.2, 0); scene.add(paddle1);
    paddle2 = new THREE.Mesh(pGeo, new THREE.MeshStandardMaterial({ color: 0xf472b6, emissive: 0xf472b6, emissiveIntensity: 0.4, metalness: 0.6, roughness: 0.3 }));
    paddle2.position.set(W/2 - 0.5, 0.2, 0); scene.add(paddle2);

    ball = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 20, 20),
      new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xa78bfa, emissiveIntensity: 0.5, metalness: 0.5, roughness: 0.2 })
    );
    ball.position.set(0, 0.25, 0); scene.add(ball);

    Hub.setScore('0 — 0');
    Hub.showPads({
      left: [[{ id: 'KeyW', label: '▲' }], [{ id: 'KeyS', label: '▼' }]],
      right: [[{ id: 'ArrowUp', label: '▲', cls: 'pink' }], [{ id: 'ArrowDown', label: '▼', cls: 'pink' }]]
    });

    function resetBall(dir) {
      ball.position.set(0, 0.25, 0);
      const a = (Math.random() - 0.5) * 0.8;
      ballVel.x = dir * (0.11 + Math.random() * 0.04);
      ballVel.z = Math.sin(a) * 0.1;
    }
    function begin() {
      score1 = score2 = 0; Hub.setScore('0 — 0');
      Hub.hideOverlay(); running = true; resetBall(1);
    }
    Hub.showOverlay(`<h2>Neon Pong 3D</h2><p>P1 left · P2 right<br>First to 7</p><button class="btn-play" id="go">PLAY</button>`);
    document.getElementById('go').onclick = begin;

    const onResize = () => {
      if (!renderer) return;
      const w = wrap.clientWidth, h = wrap.clientHeight;
      camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
    };
    window.addEventListener('resize', onResize);

    function loop() {
      animId = requestAnimationFrame(loop);
      if (!renderer) return;
      if (running) {
        const spd = 0.18;
        if (Input.on('KeyW')) paddle1.position.z = Math.max(-D/2 + 0.9, paddle1.position.z - spd);
        if (Input.on('KeyS')) paddle1.position.z = Math.min(D/2 - 0.9, paddle1.position.z + spd);
        if (Input.on('ArrowUp')) paddle2.position.z = Math.max(-D/2 + 0.9, paddle2.position.z - spd);
        if (Input.on('ArrowDown')) paddle2.position.z = Math.min(D/2 - 0.9, paddle2.position.z + spd);

        ball.position.x += ballVel.x; ball.position.z += ballVel.z;
        if (ball.position.z > D/2 - 0.25 || ball.position.z < -D/2 + 0.25) {
          ballVel.z *= -1;
          ball.position.z = Math.max(-D/2 + 0.25, Math.min(D/2 - 0.25, ball.position.z));
        }
        function hit(p, side) {
          if (Math.abs(ball.position.x - p.position.x) < 0.4 && Math.abs(ball.position.z - p.position.z) < 1.0) {
            ballVel.x = Math.abs(ballVel.x) * side * 1.05;
            ballVel.z += (ball.position.z - p.position.z) * 0.08;
            ball.position.x = p.position.x + side * 0.4;
            const m = 0.22;
            ballVel.x = Math.max(-m, Math.min(m, ballVel.x));
            ballVel.z = Math.max(-m, Math.min(m, ballVel.z));
          }
        }
        hit(paddle1, 1); hit(paddle2, -1);
        if (ball.position.x < -W/2 - 0.5) {
          score2++; Hub.setScore(score1 + ' — ' + score2);
          if (score2 >= 7) end('Player 2 Wins!'); else resetBall(1);
        } else if (ball.position.x > W/2 + 0.5) {
          score1++; Hub.setScore(score1 + ' — ' + score2);
          if (score1 >= 7) end('Player 1 Wins!'); else resetBall(-1);
        }
      }
      camera.position.x = Math.sin(Date.now() * 0.0003) * 0.3;
      camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    }
    function end(msg) {
      running = false;
      Hub.showOverlay(`<h2>${msg}</h2><p>${score1} — ${score2}</p><button class="btn-play" id="go">PLAY AGAIN</button>`);
      document.getElementById('go').onclick = begin;
    }
    loop();

    this._cleanup = () => {
      running = false; cancelAnimationFrame(animId);
      window.removeEventListener('resize', onResize);
      Hub.hidePads();
      if (renderer) { renderer.dispose(); renderer.domElement.remove(); }
    };
  },
  stop() { if (this._cleanup) this._cleanup(); }
});

/* ========== GAME 2: Light Cycle ========== */
Games.register({
  id: 'tron', name: 'Light Cycle', icon: '🌀', tags: ['Neon', '2P'],
  start(wrap) {
    let canvas = document.createElement('canvas');
    wrap.appendChild(canvas);
    let ctx = canvas.getContext('2d');
    let w, h, running = false, p1, p2, trails, animId, tick = 0;
    const CELL = 8;
    const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

    function resize() {
      w = canvas.width = wrap.clientWidth;
      h = canvas.height = wrap.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    Hub.showPads({
      left: [
        [{ id: 'KeyW', label: '▲' }],
        [{ id: 'KeyA', label: '◀' }, { id: 'KeyS', label: '▼' }, { id: 'KeyD', label: '▶' }]
      ],
      right: [
        [{ id: 'ArrowUp', label: '▲', cls: 'pink' }],
        [{ id: 'ArrowLeft', label: '◀', cls: 'pink' }, { id: 'ArrowDown', label: '▼', cls: 'pink' }, { id: 'ArrowRight', label: '▶', cls: 'pink' }]
      ]
    });

    function begin() {
      const cols = Math.floor(w / CELL), rows = Math.floor(h / CELL);
      p1 = { x: Math.floor(cols * 0.25), y: Math.floor(rows / 2), dir: 'right', color: '#22d3ee', alive: true };
      p2 = { x: Math.floor(cols * 0.75), y: Math.floor(rows / 2), dir: 'left', color: '#f472b6', alive: true };
      trails = new Set();
      trails.add(p1.x + ',' + p1.y); trails.add(p2.x + ',' + p2.y);
      Hub.hideOverlay(); running = true; Hub.setScore('Survive!');
    }
    Hub.showOverlay(`<h2>Light Cycle</h2><p>Don't hit walls or trails</p><button class="btn-play" id="go">PLAY</button>`);
    document.getElementById('go').onclick = begin;

    // direction changes
    const turn = () => {
      if (!p1 || !p2) return;
      if (p1.alive) {
        if (Input.on('KeyW') && p1.dir !== 'down') p1.dir = 'up';
        if (Input.on('KeyS') && p1.dir !== 'up') p1.dir = 'down';
        if (Input.on('KeyA') && p1.dir !== 'right') p1.dir = 'left';
        if (Input.on('KeyD') && p1.dir !== 'left') p1.dir = 'right';
      }
      if (p2.alive) {
        if (Input.on('ArrowUp') && p2.dir !== 'down') p2.dir = 'up';
        if (Input.on('ArrowDown') && p2.dir !== 'up') p2.dir = 'down';
        if (Input.on('ArrowLeft') && p2.dir !== 'right') p2.dir = 'left';
        if (Input.on('ArrowRight') && p2.dir !== 'left') p2.dir = 'right';
      }
    };

    function move(p) {
      if (!p.alive) return;
      const [dx, dy] = DIRS[p.dir];
      p.x += dx; p.y += dy;
      const cols = Math.floor(w / CELL), rows = Math.floor(h / CELL);
      const key = p.x + ',' + p.y;
      if (p.x < 0 || p.y < 0 || p.x >= cols || p.y >= rows || trails.has(key)) { p.alive = false; return; }
      trails.add(key);
    }

    function loop() {
      animId = requestAnimationFrame(loop);
      tick++; turn();
      if (running && tick % 3 === 0) {
        move(p1); move(p2);
        if (!p1.alive || !p2.alive) {
          running = false;
          const msg = !p1.alive && !p2.alive ? 'Draw!' : (!p1.alive ? 'Player 2 Wins!' : 'Player 1 Wins!');
          Hub.showOverlay(`<h2>${msg}</h2><button class="btn-play" id="go">PLAY AGAIN</button>`);
          document.getElementById('go').onclick = begin;
        }
      }
      // draw
      ctx.fillStyle = '#050510'; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = 'rgba(34,211,238,0.06)'; ctx.lineWidth = 1;
      for (let x = 0; x < w; x += CELL) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }

/* ========== GAME 3: Tower Stack 3D ========== */
Games.register({
  id: 'stack3d', name: 'Tower Stack 3D', icon: '🧱', tags: ['3D', '1P'],
  start(wrap) {
    let scene, camera, renderer, animId, stack = [], current, moving = true, dir = 1, speed = 0.08;
    let score = 0, running = false, gameOver = false;
    const SIZE = 3;

    const width = wrap.clientWidth, height = wrap.clientHeight;
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070712);
    scene.fog = new THREE.Fog(0x070712, 15, 40);
    camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
    camera.position.set(8, 10, 8); camera.lookAt(0, 2, 0);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    wrap.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x446688, 0.7));
    const d = new THREE.DirectionalLight(0xffffff, 0.8); d.position.set(5, 12, 5); scene.add(d);

    function addBlock(x, y, z, sx, sz, color, isCur) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(sx, 0.5, sz),
        new THREE.MeshStandardMaterial({ color, metalness: 0.4, roughness: 0.35, emissive: color, emissiveIntensity: 0.15 })
      );
      mesh.position.set(x, y, z); scene.add(mesh);
      const b = { mesh, x, y, z, sx, sz };
      if (!isCur) stack.push(b);
      return b;
    }
    function spawn() {
      const last = stack[stack.length - 1];
      const y = last.y + 0.5;
      const colors = [0x22d3ee, 0xf472b6, 0xa78bfa, 0x4ade80, 0xfb923c];
      current = addBlock(last.x - 4, y, last.z, last.sx, last.sz, colors[score % colors.length], true);
      dir = Math.random() > 0.5 ? 1 : -1; moving = true;
      camera.position.y = y + 8; camera.lookAt(last.x, y, last.z);
    }
    addBlock(0, 0, 0, SIZE, SIZE, 0x334455, false);
    spawn();
    Hub.setScore('Score: 0');

    function place() {
      if (!running || gameOver || !moving || !current) return;
      moving = false;
      const last = stack[stack.length - 1];
      const curL = current.mesh.position.x - current.sx / 2, curR = current.mesh.position.x + current.sx / 2;
      const lastL = last.x - last.sx / 2, lastR = last.x + last.sx / 2;
      const oL = Math.max(curL, lastL), oR = Math.min(curR, lastR), overlap = oR - oL;
      if (overlap <= 0.05) {
        gameOver = true; running = false;
        Hub.showOverlay(`<h2>Game Over</h2><p>Score: ${score}</p><button class="btn-play" id="go">PLAY AGAIN</button>`);
        document.getElementById('go').onclick = restart;
        return;
      }
      scene.remove(current.mesh);
      const colors = [0x22d3ee, 0xf472b6, 0xa78bfa, 0x4ade80, 0xfb923c];
      addBlock((oL + oR) / 2, current.mesh.position.y, last.z, overlap, last.sz, colors[score % colors.length], false);
      score++; Hub.setScore('Score: ' + score);
      speed = Math.min(0.2, 0.08 + score * 0.004);
      spawn();
    }
    function restart() {
      while (scene.children.length) scene.remove(scene.children[0]);
      scene.add(new THREE.AmbientLight(0x446688, 0.7));
      const d = new THREE.DirectionalLight(0xffffff, 0.8); d.position.set(5, 12, 5); scene.add(d);
      stack = []; score = 0; gameOver = false; speed = 0.08; Hub.setScore('Score: 0');
      addBlock(0, 0, 0, SIZE, SIZE, 0x334455, false); spawn();
      Hub.hideOverlay(); running = true;
    }

    Hub.showPads({ left: [], right: [[{ id: 'Space', label: 'DROP', wide: true }]] });
    Hub.showOverlay(`<h2>Tower Stack 3D</h2><p>Tap / Space to drop</p><button class="btn-play" id="go">PLAY</button>`);
    document.getElementById('go').onclick = () => { Hub.hideOverlay(); running = true; };

    const onKey = e => { if (e.code === 'Space') { e.preventDefault(); place(); } };
    const onPointer = e => { e.preventDefault(); place(); };
    window.addEventListener('keydown', onKey);
    renderer.domElement.addEventListener('pointerdown', onPointer);

    const onResize = () => {
      if (!renderer) return;
      const ww = wrap.clientWidth, hh = wrap.clientHeight;
      camera.aspect = ww / hh; camera.updateProjectionMatrix(); renderer.setSize(ww, hh);
    };
    window.addEventListener('resize', onResize);

    function loop() {
      animId = requestAnimationFrame(loop);
      if (!renderer) return;
      if (running && moving && current) {
        current.mesh.position.x += dir * speed;
        if (current.mesh.position.x > 5 || current.mesh.position.x < -5) dir *= -1;
        if (Input.on('Space')) { /* handled by keydown mostly */ }
      }
      renderer.render(scene, camera);
    }
    // also place when virtual Space is held briefly
    let spaceWas = false;
    const spaceCheck = setInterval(() => {
      const now = Input.on('Space');
      if (now && !spaceWas) place();
      spaceWas = now;
    }, 50);

    loop();
    this._cleanup = () => {
      running = false; cancelAnimationFrame(animId); clearInterval(spaceCheck);
      window.removeEventListener('keydown', onKey);
      window.removeEventListener('resize', onResize);
      Hub.hidePads();
      if (renderer) { renderer.dispose(); renderer.domElement.remove(); }
    };
  },
  stop() { if (this._cleanup) this._cleanup(); }
});

/* ========== GAME 5: Head Soccer ========== */
Games.register({
  id: 'soccer', name: 'Head Soccer', icon: '⚽', tags: ['Sports', '2P'],
  start(wrap) {
    let canvas = document.createElement('canvas');
    wrap.appendChild(canvas);
    let ctx = canvas.getContext('2d'), w, h, running = false, p1, p2, ball, animId;
    let score1 = 0, score2 = 0;
    const G = 0.35;

    function resize() { w = canvas.width = wrap.clientWidth; h = canvas.height = wrap.clientHeight; }
    resize(); window.addEventListener('resize', resize);

    Hub.showPads({
      left: [[{ id: 'KeyW', label: '⬆' }], [{ id: 'KeyA', label: '◀' }, { id: 'KeyD', label: '▶' }]],
      right: [[{ id: 'ArrowUp', label: '⬆', cls: 'pink' }], [{ id: 'ArrowLeft', label: '◀', cls: 'pink' }, { id: 'ArrowRight', label: '▶', cls: 'pink' }]]
    });

    function begin() {
      const ground = h - 40;
      p1 = { x: w * 0.25, y: ground - 30, vx: 0, vy: 0, r: 26, color: '#22d3ee', onGround: true };
      p2 = { x: w * 0.75, y: ground - 30, vx: 0, vy: 0, r: 26, color: '#f472b6', onGround: true };
      ball = { x: w / 2, y: ground - 80, vx: 0, vy: 0, r: 13 };
      score1 = score2 = 0; Hub.setScore('0 — 0');
      Hub.hideOverlay(); running = true;
    }
    Hub.showOverlay(`<h2>Head Soccer</h2><p>First to 5 goals</p><button class="btn-play" id="go">PLAY</button>`);
    document.getElementById('go').onclick = begin;

    function loop() {
      animId = requestAnimationFrame(loop);
      const ground = h - 40;
      if (running) {
        if (Input.on('KeyA')) p1.vx -= 0.55;
        if (Input.on('KeyD')) p1.vx += 0.55;
        if (Input.on('KeyW') && p1.onGround) { p1.vy = -9; p1.onGround = false; }
        if (Input.on('ArrowLeft')) p2.vx -= 0.55;
        if (Input.on('ArrowRight')) p2.vx += 0.55;
        if (Input.on('ArrowUp') && p2.onGround) { p2.vy = -9; p2.onGround = false; }

        [p1, p2].forEach(p => {
          p.vx *= 0.88; p.vy += G; p.x += p.vx; p.y += p.vy;
          if (p.y >= ground - p.r) { p.y = ground - p.r; p.vy = 0; p.onGround = true; }
          p.x = Math.max(p.r, Math.min(w - p.r, p.x));
        });
        ball.vy += G * 0.9; ball.x += ball.vx; ball.y += ball.vy; ball.vx *= 0.995;
        if (ball.y >= ground - ball.r) { ball.y = ground - ball.r; ball.vy *= -0.7; ball.vx *= 0.9; }
        if (ball.x < ball.r || ball.x > w - ball.r) { ball.vx *= -0.85; ball.x = Math.max(ball.r, Math.min(w - ball.r, ball.x)); }
        if (ball.y < ball.r) { ball.vy *= -0.8; ball.y = ball.r; }

        [p1, p2].forEach(p => {
          const dx = ball.x - p.x, dy = ball.y - p.y, dist = Math.sqrt(dx * dx + dy * dy), minD = p.r + ball.r;
          if (dist < minD && dist > 0) {
            const nx = dx / dist, ny = dy / dist;
            ball.x = p.x + nx * minD; ball.y = p.y + ny * minD;
            const dot = ball.vx * nx + ball.vy * ny;
            ball.vx = (ball.vx - 1.8 * dot * nx) + p.vx * 0.4;
            ball.vy = (ball.vy - 1.8 * dot * ny) + p.vy * 0.3 - 2;
          }
        });
        if (ball.x < 18 && ball.y > ground - 100) { score2++; afterGoal(); }
        else if (ball.x > w - 18 && ball.y > ground - 100) { score1++; afterGoal(); }
      }
      // draw
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#0c1220'); g.addColorStop(1, '#152010');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#1a3a1a'; ctx.fillRect(0, ground, w, h - ground);
      ctx.fillStyle = '#2d5a2d'; ctx.fillRect(0, ground, w, 5);
      ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 3;
      ctx.strokeRect(0, ground - 100, 16, 100); ctx.strokeRect(w - 16, ground - 100, 16, 100);
      [p1, p2].forEach(p => {
        if (!p) return;
        ctx.shadowColor = p.color; ctx.shadowBlur = 10; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.ellipse(p.x, p.y + 6, p.r * 0.7, p.r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(p.x, p.y - 10, p.r * 0.5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0; ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(p.x + (p === p1 ? 5 : -5), p.y - 12, 3.5, 0, Math.PI * 2); ctx.fill();
      });
      if (ball) {
        ctx.shadowColor = '#fff'; ctx.shadowBlur = 8; ctx.fillStyle = '#f8fafc';
        ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
      }
    }
    function afterGoal() {
      Hub.setScore(score1 + ' — ' + score2);
      ball.x = w / 2; ball.y = h / 2; ball.vx = 0; ball.vy = 0;
      if (score1 >= 5 || score2 >= 5) {
        running = false;
        const msg = score1 >= 5 ? 'Player 1 Wins!' : 'Player 2 Wins!';
        Hub.showOverlay(`<h2>${msg}</h2><p>${score1} — ${score2}</p><button class="btn-play" id="go">PLAY AGAIN</button>`);
        document.getElementById('go').onclick = begin;
      }
    }
    loop();
    this._cleanup = () => { running = false; cancelAnimationFrame(animId); window.removeEventListener('resize', resize); Hub.hidePads(); };
  },
  stop() { if (this._cleanup) this._cleanup(); }
});

/* ========== GAME 6: Blade Duel ========== */
Games.register({
  id: 'duel', name: 'Blade Duel', icon: '⚔️', tags: ['Fight', '2P'],
  start(wrap) {
    let canvas = document.createElement('canvas');
    wrap.appendChild(canvas);
    let ctx = canvas.getContext('2d'), w, h, running = false, p1, p2, animId;
    let score1 = 0, score2 = 0;
    const MAX_HP = 100;

    function resize() { w = canvas.width = wrap.clientWidth; h = canvas.height = wrap.clientHeight; }
    resize(); window.addEventListener('resize', resize);

    Hub.showPads({
      left: [[{ id: 'KeyF', label: 'ATK' }], [{ id: 'KeyA', label: '◀' }, { id: 'KeyD', label: '▶' }]],
      right: [[{ id: 'KeyL', label: 'ATK', cls: 'pink' }], [{ id: 'ArrowLeft', label: '◀', cls: 'pink' }, { id: 'ArrowRight', label: '▶', cls: 'pink' }]]
    });

    function begin() {
      const ground = h - 50;
      p1 = { x: w * 0.3, y: ground, vx: 0, facing: 1, hp: MAX_HP, color: '#22d3ee', attackCD: 0, attacking: 0 };
      p2 = { x: w * 0.7, y: ground, vx: 0, facing: -1, hp: MAX_HP, color: '#f472b6', attackCD: 0, attacking: 0 };
      Hub.hideOverlay(); running = true; Hub.setScore(score1 + ' — ' + score2);
    }
    Hub.showOverlay(`<h2>Blade Duel</h2><p>Reduce enemy HP to 0</p><button class="btn-play" id="go">PLAY</button>`);
    document.getElementById('go').onclick = begin;

    function attack(a, d) {
      if (a.attackCD > 0) return;
      a.attackCD = 22; a.attacking = 12;
      if (Math.abs(a.x - d.x) < 70) {
        d.hp = Math.max(0, d.hp - 12); d.vx = a.facing * 8;
        if (d.hp <= 0) {
          running = false;
          if (a === p1) score1++; else score2++;
          Hub.setScore(score1 + ' — ' + score2);
          Hub.showOverlay(`<h2>${a === p1 ? 'P1' : 'P2'} Wins Round!</h2><p>${score1} — ${score2}</p><button class="btn-play" id="go">NEXT</button>`);
          document.getElementById('go').onclick = begin;
        }
      }
    }

    let fWas = false, lWas = false;
    function loop() {
      animId = requestAnimationFrame(loop);
      const ground = h - 50;
      if (running && p1 && p2) {
        p1.vx *= 0.8; p2.vx *= 0.8;
        if (Input.on('KeyA')) p1.vx -= 0.85;

        if (Input.on('ArrowLeft')) p2.vx -= 0.85;
        if (Input.on('ArrowRight')) p2.vx += 0.85;
        const fNow = Input.on('KeyF'), lNow = Input.on('KeyL');
        if (fNow && !fWas) attack(p1, p2);
        if (lNow && !lWas) attack(p2, p1);
        fWas = fNow; lWas = lNow;

        p1.x += p1.vx; p2.x += p2.vx;
        p1.x = Math.max(40, Math.min(w - 40, p1.x));
        p2.x = Math.max(40, Math.min(w - 40, p2.x));
        p1.facing = p1.x < p2.x ? 1 : -1;
        p2.facing = p2.x < p1.x ? 1 : -1;
        if (p1.attackCD > 0) p1.attackCD--;
        if (p2.attackCD > 0) p2.attackCD--;
        if (p1.attacking > 0) p1.attacking--;
        if (p2.attacking > 0) p2.attacking--;
      }
      // draw
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#12081a'); g.addColorStop(1, '#0a0510');
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#1a1028'; ctx.fillRect(0, ground, w, h - ground);
      ctx.strokeStyle = 'rgba(167,139,250,0.4)'; ctx.lineWidth = 2;

      function drawHP(x, y, hp, color, label) {

        ctx.fillText(label, x + 4, y + 11);
      }
      if (p1) drawHP(16, 20, p1.hp, p1.color, 'P1');
      if (p2) drawHP(w - Math.min(196, w * 0.35) - 16, 20, p2.hp, p2.color, 'P2');

      [p1, p2].forEach(p => {
        if (!p) return;
        ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.facing, 1);
        ctx.shadowColor = p.color; ctx.shadowBlur = 10; ctx.fillStyle = p.color;
        ctx.beginPath();
        const r = 6;
        ctx.moveTo(-14 + r, -50); ctx.arcTo(14, -50, 14, 0, r); ctx.arcTo(14, 0, -14, 0, r);
        ctx.arcTo(-14, 0, -14, -50, r); ctx.arcTo(-14, -50, 14, -50, r); ctx.fill();
        ctx.beginPath(); ctx.arc(0, -62, 14, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e2e8f0'; ctx.shadowColor = '#fff'; ctx.shadowBlur = p.attacking > 0 ? 16 : 4;
        ctx.save(); ctx.translate(16, -32); ctx.rotate(p.attacking > 0 ? -0.9 : -0.2);
        ctx.fillRect(0, -3, 44, 6); ctx.fillStyle = '#94a3b8'; ctx.fillRect(-6, -5, 10, 10);
        ctx.restore(); ctx.restore();
      });
    }
    loop();
    this._cleanup = () => { running = false; cancelAnimationFrame(animId); window.removeEventListener('resize', resize); Hub.hidePads(); };
  },
  stop() { if (this._cleanup) this._cleanup(); }
});

/* ========== GAME: Cross Zero (Tic-Tac-Toe) ========== */
Games.register({
  id: 'tictactoe',
  name: 'Cross Zero',
  icon: '✖️',
  tags: ['2P', 'Classic'],
  start(wrap) {
    let canvas = document.createElement('canvas');
    wrap.appendChild(canvas);
    let ctx = canvas.getContext('2d');
    let w, h, board, turn, winner, cells, animId, running = false;
    const SIZE = 3;

    function resize() {
      w = canvas.width = wrap.clientWidth;
      h = canvas.height = wrap.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function cellSize() {
      return Math.min(w, h) * 0.72 / SIZE;
    }
    function origin() {
      const s = cellSize() * SIZE;
      return { x: (w - s) / 2, y: (h - s) / 2 - 10 };
    }

    function reset() {
      board = Array(SIZE * SIZE).fill(null);
      turn = 'X';
      winner = null;
      running = true;
      Hub.setScore('X turn');
      Hub.hideOverlay();
    }

    function checkWin() {
      const lines = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      for (const [a,b,c] of lines) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return board[a];
        }
      }
      if (board.every(c => c)) return 'draw';
      return null;
    }

    function place(i) {
      if (!running || board[i] || winner) return;
      board[i] = turn;
      winner = checkWin();
      if (winner === 'X' || winner === 'O') {
        running = false;
        Hub.setScore(winner + ' wins!');
        Hub.showOverlay(
          `<h2>${winner} Wins!</h2><p>Nice game</p><button class="btn-play" id="go">PLAY AGAIN</button>`
        );
        document.getElementById('go').onclick = reset;
      } else if (winner === 'draw') {
        running = false;
        Hub.setScore('Draw');
        Hub.showOverlay(
          `<h2>Draw!</h2><button class="btn-play" id="go">PLAY AGAIN</button>`
        );
        document.getElementById('go').onclick = reset;
      } else {
        turn = turn === 'X' ? 'O' : 'X';
        Hub.setScore(turn + ' turn');
      }
    }

    function hitTest(mx, my) {
      const o = origin();
      const s = cellSize();
      const gx = Math.floor((mx - o.x) / s);
      const gy = Math.floor((my - o.y) / s);
      if (gx < 0 || gy < 0 || gx >= SIZE || gy >= SIZE) return -1;
      return gy * SIZE + gx;
    }

    function onPointer(e) {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      const mx = (t.clientX - rect.left) * (canvas.width / rect.width);
      const my = (t.clientY - rect.top) * (canvas.height / rect.height);
      const i = hitTest(mx, my);
      if (i >= 0) place(i);
    }
    canvas.addEventListener('pointerdown', onPointer);

    // optional keyboard 1-9
    function onKey(e) {
      const map = {
        Digit1: 6, Digit2: 7, Digit3: 8,
        Digit4: 3, Digit5: 4, Digit6: 5,
        Digit7: 0, Digit8: 1, Digit9: 2,
        Numpad1: 6, Numpad2: 7, Numpad3: 8,
        Numpad4: 3, Numpad5: 4, Numpad6: 5,
        Numpad7: 0, Numpad8: 1, Numpad9: 2
      };
      if (map[e.code] !== undefined) place(map[e.code]);
    }
    window.addEventListener('keydown', onKey);

    function drawX(cx, cy, s) {
      const p = s * 0.28;
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = Math.max(4, s * 0.08);
      ctx.lineCap = 'round';
      ctx.shadowColor = '#22d3ee';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(cx - p, cy - p);
      ctx.lineTo(cx + p, cy + p);
      ctx.moveTo(cx + p, cy - p);
      ctx.lineTo(cx - p, cy + p);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    function drawO(cx, cy, s) {
      ctx.strokeStyle = '#f472b6';
      ctx.lineWidth = Math.max(4, s * 0.08);
      ctx.shadowColor = '#f472b6';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(cx, cy, s * 0.28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function loop() {
      animId = requestAnimationFrame(loop);
      ctx.fillStyle = '#07070c';
      ctx.fillRect(0, 0, w, h);

      const o = origin();
      const s = cellSize();

      // grid lines (brush style thick)
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = Math.max(5, s * 0.06);
      ctx.lineCap = 'round';
      for (let i = 1; i < SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(o.x + i * s, o.y + s * 0.05);
        ctx.lineTo(o.x + i * s, o.y + SIZE * s - s * 0.05);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(o.x + s * 0.05, o.y + i * s);
        ctx.lineTo(o.x + SIZE * s - s * 0.05, o.y + i * s);
        ctx.stroke();
      }

      // marks
      for (let i = 0; i < 9; i++) {
        if (!board || !board[i]) continue;
        const gx = i % SIZE, gy = Math.floor(i / SIZE);
        const cx = o.x + gx * s + s / 2;
        const cy = o.y + gy * s + s / 2;
        if (board[i] === 'X') drawX(cx, cy, s);
        else drawO(cx, cy, s);
      }
    }

    Hub.showOverlay(
      `<h2>Cross Zero</h2><p>Tap a cell · X starts<br>P1 = X (cyan) · P2 = O (pink)</p><button class="btn-play" id="go">PLAY</button>`
    );
    document.getElementById('go').onclick = reset;
    loop();

    this._cleanup = () => {
      running = false;
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      window.removeEventListener('keydown', onKey);
      canvas.removeEventListener('pointerdown', onPointer);
    };
  },
  stop() {
    if (this._cleanup) this._cleanup();
  }
});

/* ========== GAME: Ludo ========== */
Games.register({
  id: 'ludo',
  name: 'Ludo',
  icon: '🎲',
  tags: ['2P', 'Board'],
  start(wrap) {
    let canvas = document.createElement('canvas');
    wrap.appendChild(canvas);
    let ctx = canvas.getContext('2d');
    let w, h, animId, running = false;
    let phase = 'menu'; // menu | play | win
    let numPlayers = 2;
    let current = 0; // player index
    let dice = 1;
    let diceRolling = false;
    let canRoll = true;
    let selectedToken = -1;
    let winner = null;
    let message = '';

    // Colors: Red, Green, Yellow, Blue
    const COLORS = ['#ef4444', '#22c55e', '#eab308', '#3b82f6'];
    const NAMES = ['Red', 'Green', 'Yellow', 'Blue'];

    // Board path: 52 main cells (index 0-51)
    // Each player start index on main path
    const START = [0, 13, 26, 39];
    // Safe cells (cannot be captured)
    const SAFE = new Set([0, 8, 13, 21, 26, 34, 39, 47]);

    // tokens[player][token] = { pos: -1 home yard | 0-51 path | 100-105 home column | 999 finished }
    let tokens = [];

    function resize() {
      w = canvas.width = wrap.clientWidth;
      h = canvas.height = wrap.clientHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function initTokens() {
      tokens = [];
      for (let p = 0; p < 4; p++) {
        tokens[p] = [];
        for (let t = 0; t < 4; t++) {
          tokens[p][t] = { pos: -1 }; // in yard
        }
      }
    }

    function boardSize() {
      return Math.min(w, h) * 0.92;
    }
    function boardOrigin() {
      const s = boardSize();
      return { x: (w - s) / 2, y: (h - s) / 2 };
    }

    // Convert main path index (0-51) to board pixel
    function pathToXY(idx) {
      const s = boardSize();
      const o = boardOrigin();
      const cell = s / 15;
      // Classic Ludo path layout on 15x15 grid
      // Bottom row going left-to-right near red home: simplified ring
      const coords = buildPathCoords(cell, o);
      return coords[idx % 52];
    }

    function buildPathCoords(cell, o) {
      const pts = [];
      // Bottom arm (left to right) y = 8*cell area — simplified square path
      // Outer track: 52 cells around
      // Top row (left→right): y index 6
      for (let i = 0; i < 6; i++) pts.push({ x: o.x + (6 + i) * cell + cell / 2, y: o.y + 6 * cell + cell / 2 });
      // Right column (top→bottom)
      for (let i = 0; i < 6; i++) pts.push({ x: o.x + 12 * cell + cell / 2, y: o.y + (6 + i) * cell + cell / 2 });
      // extra corner
      pts.push({ x: o.x + 13 * cell + cell / 2, y: o.y + 12 * cell + cell / 2 });
      // Bottom row (right→left)
      for (let i = 0; i < 6; i++) pts.push({ x: o.x + (12 - i) * cell + cell / 2, y: o.y + 12 * cell + cell / 2 });
      // Left column bottom part
      for (let i = 0; i < 2; i++) pts.push({ x: o.x + 6 * cell + cell / 2, y: o.y + (13 + i) * cell + cell / 2 });
      // Bottom left stretch
      for (let i = 0; i < 6; i++) pts.push({ x: o.x + (6 - i) * cell + cell / 2, y: o.y + 14 * cell + cell / 2 });
      // Left column (bottom→top)
      for (let i = 0; i < 6; i++) pts.push({ x: o.x + 0 * cell + cell / 2, y: o.y + (12 - i) * cell + cell / 2 });
      pts.push({ x: o.x + 0 * cell + cell / 2, y: o.y + 6 * cell + cell / 2 });
      // Top row left part (left→right remaining)
      for (let i = 0; i < 5; i++) pts.push({ x: o.x + (1 + i) * cell + cell / 2, y: o.y + 6 * cell + cell / 2 });
      // Fill to 52 if short
      while (pts.length < 52) {
        pts.push(pts[pts.length - 1] || { x: o.x + s / 2, y: o.y + s / 2 });
      }
      return pts.slice(0, 52);
    }

    // Home column positions (6 cells into center for each player)
    function homeColXY(player, step) {
      // step 0-5
      const s = boardSize();
      const o = boardOrigin();
      const cell = s / 15;
      const cx = o.x + 7.5 * cell;
      const cy = o.y + 7.5 * cell;
      if (player === 0) return { x: cx, y: o.y + (13 - step) * cell + cell / 2 }; // red from bottom
      if (player === 1) return { x: o.x + (1 + step) * cell + cell / 2, y: cy }; // green from left
      if (player === 2) return { x: cx, y: o.y + (1 + step) * cell + cell / 2 }; // yellow from top
      return { x: o.x + (13 - step) * cell + cell / 2, y: cy }; // blue from right
    }

    function yardXY(player, tokenIdx) {
      const s = boardSize();
      const o = boardOrigin();
      const cell = s / 15;
      const bases = [
        { x: 1.5, y: 10.5 }, // red bottom-left
        { x: 1.5, y: 1.5 },  // green top-left
        { x: 10.5, y: 1.5 }, // yellow top-right
        { x: 10.5, y: 10.5 } // blue bottom-right
      ];
      const b = bases[player];
      const ox = (tokenIdx % 2) * 1.2;
      const oy = Math.floor(tokenIdx / 2) * 1.2;
      return {
        x: o.x + (b.x + ox) * cell + cell / 2,
        y: o.y + (b.y + oy) * cell + cell / 2
      };
    }

    function tokenPixel(p, t) {
      const tok = tokens[p][t];
      if (tok.pos === -1) return yardXY(p, t);
      if (tok.pos >= 100 && tok.pos < 106) return homeColXY(p, tok.pos - 100);
      if (tok.pos === 999) {
        const s = boardSize();
        const o = boardOrigin();
        return { x: o.x + boardSize() / 2, y: o.y + boardSize() / 2 };
      }
      // main path: map player-relative to global
      const global = (START[p] + tok.pos) % 52;
      return pathToXY(global);
    }

    function movableTokens(player, roll) {
      const list = [];
      for (let t = 0; t < 4; t++) {
        const pos = tokens[player][t].pos;
        if (pos === 999) continue;
        if (pos === -1) {
          if (roll === 6) list.push(t);
        } else if (pos >= 100) {
          // home column
          const step = pos - 100;
          if (step + roll <= 5) list.push(t);
        } else {
          // on path
          const next = pos + roll;
          if (next < 51) list.push(t);
          else if (next === 51) list.push(t); // enter home stretch start
          else if (next > 51 && next <= 56) list.push(t); // can enter home
        }
      }
      return list;
    }

    function moveToken(player, tIdx, roll) {
      const tok = tokens[player][tIdx];
      if (tok.pos === -1 && roll === 6) {
        tok.pos = 0; // enter board at start
      } else if (tok.pos >= 0 && tok.pos < 51) {
        let next = tok.pos + roll;
        if (next < 51) {
          tok.pos = next;
        } else {
          // enter home column
          const over = next - 51;
          tok.pos = 100 + over;
          if (tok.pos > 105) tok.pos = 999;
        }
      } else if (tok.pos >= 100 && tok.pos <= 105) {
        tok.pos += roll;
        if (tok.pos > 105) tok.pos = 999;
      }

      // capture check (only on main path)
      if (tok.pos >= 0 && tok.pos < 51) {
        const global = (START[player] + tok.pos) % 52;
        if (!SAFE.has(global)) {
          for (let op = 0; op < numPlayers; op++) {
            if (op === player) continue;
            for (let ot = 0; ot < 4; ot++) {
              const opp = tokens[op][ot];
              if (opp.pos >= 0 && opp.pos < 51) {
                const og = (START[op] + opp.pos) % 52;
                if (og === global) {
                  opp.pos = -1; // send home
                  message = NAMES[op] + ' captured!';
                }
              }
            }
          }
        }
      }

      // win check
      if (tokens[player].every(t => t.pos === 999)) {
        winner = player;
        phase = 'win';
        running = false;
        Hub.setScore(NAMES[player] + ' wins!');
        Hub.showOverlay(
          `<h2>${NAMES[player]} Wins!</h2><button class="btn-play" id="go">PLAY AGAIN</button>`
        );
        document.getElementById('go').onclick = () => showMenu();
      }
    }

    function nextTurn(extra) {
      selectedToken = -1;
      if (extra) {
        canRoll = true;
        message = NAMES[current] + ' rolls again (6)';
        return;
      }
      current = (current + 1) % numPlayers;
      canRoll = true;
      message = NAMES[current] + "'s turn — roll dice";
      Hub.setScore(NAMES[current] + ' · Roll');
    }

    function rollDice() {
      if (!canRoll || diceRolling || phase !== 'play') return;
      diceRolling = true;
      canRoll = false;
      let n = 0;
      const iv = setInterval(() => {
        dice = 1 + Math.floor(Math.random() * 6);
        n++;
        if (n > 10) {
          clearInterval(iv);
          diceRolling = false;
          onDiceResult(dice);
        }
      }, 60);
    }

    function onDiceResult(roll) {
      const moves = movableTokens(current, roll);
      if (moves.length === 0) {
        message = 'No moves — next player';
        setTimeout(() => nextTurn(false), 700);
        return;
      }
      if (moves.length === 1) {
        moveToken(current, moves[0], roll);
        nextTurn(roll === 6);
      } else {
        selectedToken = -1;
        message = 'Tap a token to move (' + roll + ')';
        // store pending roll
        window._ludoPending = { roll, moves };
      }
    }

    function trySelectToken(p, t) {
      if (phase !== 'play' || p !== current) return;
      const pending = window._ludoPending;
      if (!pending) return;
      if (!pending.moves.includes(t)) return;
      moveToken(p, t, pending.roll);
      window._ludoPending = null;
      nextTurn(pending.roll === 6);
    }

    function showMenu() {
      phase = 'menu';
      winner = null;
      message = '';
      window._ludoPending = null;
      Hub.setScore('Ludo');
      Hub.showOverlay(`
        <h2>Ludo</h2>
        <p>Select players</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0">
          <button class="btn-play" id="p2" style="min-width:80px">2P</button>
          <button class="btn-play" id="p3" style="min-width:80px">3P</button>
          <button class="btn-play" id="p4" style="min-width:80px">4P</button>
        </div>
      `);
      document.getElementById('p2').onclick = () => startGame(2);
      document.getElementById('p3').onclick = () => startGame(3);
      document.getElementById('p4').onclick = () => startGame(4);
    }

    function startGame(n) {
      numPlayers = n;
      initTokens();
      current = 0;
      dice = 1;
      canRoll = true;
      selectedToken = -1;
      phase = 'play';
      running = true;
      message = NAMES[0] + "'s turn — roll dice";
      Hub.hideOverlay();
      Hub.setScore(NAMES[0] + ' · Roll');
      Hub.showPads({
        left: [],
        right: [[{ id: 'Space', label: '🎲 ROLL', wide: true }]]
      });
    }

    // Input
    let spaceWas = false;
    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (phase !== 'play') return;
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
      const my = (e.clientY - rect.top) * (canvas.height / rect.height);

      // dice button area (bottom center)
      const s = boardSize();
      const o = boardOrigin();
      const diceX = o.x + s / 2;
      const diceY = o.y + s + 8;
      if (Math.hypot(mx - diceX, my - (Math.min(h - 30, diceY))) < 36) {
        rollDice();
        return;
      }

      // token hit
      for (let p = 0; p < numPlayers; p++) {
        for (let t = 0; t < 4; t++) {
          const pt = tokenPixel(p, t);
          if (Math.hypot(mx - pt.x, my - pt.y) < boardSize() / 30) {
            trySelectToken(p, t);
            return;
          }
        }
      }
    });

    function loop() {
      animId = requestAnimationFrame(loop);
      // virtual roll button
      const spaceNow = typeof Input !== 'undefined' && Input.on('Space');
      if (spaceNow && !spaceWas) rollDice();
      spaceWas = spaceNow;

      ctx.fillStyle = '#0a0a12';
      ctx.fillRect(0, 0, w, h);
      if (phase === 'menu') return;

      const s = boardSize();
      const o = boardOrigin();
      const cell = s / 15;

      // board background
      ctx.fillStyle = '#1a1a28';
      roundRect(ctx, o.x, o.y, s, s, 8);
      ctx.fill();

      // 4 home yards
      const yards = [
        { x: 0, y: 9, c: COLORS[0] },
        { x: 0, y: 0, c: COLORS[1] },
        { x: 9, y: 0, c: COLORS[2] },
        { x: 9, y: 9, c: COLORS[3] }
      ];
      yards.forEach((y, i) => {
        if (i >= numPlayers) {
          ctx.fillStyle = '#222230';
        } else {
          ctx.fillStyle = y.c + '44';
        }
        ctx.fillRect(o.x + y.x * cell, o.y + y.y * cell, 6 * cell, 6 * cell);
        ctx.strokeStyle = i < numPlayers ? y.c : '#333';
        ctx.lineWidth = 2;
        ctx.strokeRect(o.x + y.x * cell + 2, o.y + y.y * cell + 2, 6 * cell - 4, 6 * cell - 4);
      });

      // center cross paths (light)
      ctx.fillStyle = '#2a2a3a';
      ctx.fillRect(o.x + 6 * cell, o.y, 3 * cell, s);
      ctx.fillRect(o.x, o.y + 6 * cell, s, 3 * cell);

      // colored home columns
      const hc = [
        { x: 7, y: 9, w: 1, h: 6, c: COLORS[0] },
        { x: 1, y: 7, w: 6, h: 1, c: COLORS[1] },
        { x: 7, y: 1, w: 1, h: 6, c: COLORS[2] },
        { x: 9, y: 7, w: 6, h: 1, c: COLORS[3] }
      ];
      hc.forEach((c, i) => {
        if (i < numPlayers) {
          ctx.fillStyle = c.c + '66';
          ctx.fillRect(o.x + c.x * cell, o.y + c.y * cell, c.w * cell, c.h * cell);
        }
      });

      // center triangle / home
      ctx.fillStyle = '#111118';
      ctx.beginPath();
      ctx.moveTo(o.x + 6 * cell, o.y + 6 * cell);
      ctx.lineTo(o.x + 9 * cell, o.y + 6 * cell);
      ctx.lineTo(o.x + 9 * cell, o.y + 9 * cell);
      ctx.lineTo(o.x + 6 * cell, o.y + 9 * cell);
      ctx.closePath();
      ctx.fill();

      // grid lines subtle
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 15; i++) {
        ctx.beginPath();
        ctx.moveTo(o.x + i * cell, o.y);
        ctx.lineTo(o.x + i * cell, o.y + s);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(o.x, o.y + i * cell);
        ctx.lineTo(o.x + s, o.y + i * cell);
        ctx.stroke();
      }

      // path dots
      for (let i = 0; i < 52; i++) {
        const pt = pathToXY(i);
        ctx.fillStyle = SAFE.has(i) ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.08)';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, cell * 0.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // tokens
      for (let p = 0; p < numPlayers; p++) {
        for (let t = 0; t < 4; t++) {
          const pt = tokenPixel(p, t);
          const r = cell * 0.32;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
          ctx.fillStyle = COLORS[p];
          ctx.shadowColor = COLORS[p];
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();
          // number
          ctx.fillStyle = '#fff';
          ctx.font = 'bold ' + Math.floor(r) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(t + 1), pt.x, pt.y + 1);
        }
      }

      // dice
      const diceX = o.x + s / 2;
      const diceY = Math.min(h - 28, o.y + s + 24);
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#22d3ee';
      ctx.shadowBlur = canRoll ? 12 : 0;
      roundRect(ctx, diceX - 22, diceY - 22, 44, 44, 8);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#111';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(dice), diceX, diceY);

      // message
      ctx.fillStyle = '#94a3b8';
      ctx.font = '13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(message || '', w / 2, 18);

      // current player indicator
      if (phase === 'play') {
        ctx.fillStyle = COLORS[current];
        ctx.beginPath();
        ctx.arc(16, 18, 8, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    showMenu();
    loop();

    this._cleanup = () => {
      running = false;
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', resize);
      if (typeof Hub !== 'undefined') Hub.hidePads();
      window._ludoPending = null;
    };
  },
  stop() {
    if (this._cleanup) this._cleanup();
  }
});

/* Boot */
Hub.init();
</script>
</body>
</html>
